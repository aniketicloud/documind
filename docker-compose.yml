services:
  postgres:
    image: dhi.io/postgres:18-debian13
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: dhi.io/redis:8.8
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant
    container_name: documind-qdrant
    hostname: qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # S3-compatible object storage (RustFS) — API :9000, console :9001
  # Default credentials: rustfsadmin / rustfsadmin
  rustfs:
    image: rustfs/rustfs:latest
    container_name: documind-rustfs
    hostname: rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    command:
      - --address
      - ":9000"
      - --console-enable
      - --access-key
      - ${S3_ACCESS_KEY:-rustfsadmin}
      - --secret-key
      - ${S3_SECRET_KEY:-rustfsadmin}
      - /data
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  qdrant_storage:
  rustfs_data: