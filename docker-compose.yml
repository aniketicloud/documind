services:
  postgres:
    image: dhi.io/postgres:18-debian13
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind} -d ${POSTGRES_DB:-documind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: dhi.io/redis:8.8
    restart: always
    # protected-mode no: host apps reach Redis via Docker port publish
    command: redis-server --appendonly yes --protected-mode no
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: documind-qdrant
    hostname: qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # S3-compatible object storage (RustFS) — API :9000, console :9001
  rustfs:
    image: rustfs/rustfs:latest
    container_name: documind-rustfs
    hostname: rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    command:
      - --address
      - ":9000"
      - --console-enable
      - --access-key
      - ${S3_ACCESS_KEY:-rustfsadmin}
      - --secret-key
      - ${S3_SECRET_KEY:-rustfsadmin}
      - /data
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PDF text extract (F1: PyMuPDF native text; OCR later same service)
  pdf-extract:
    build:
      context: ./services/pdf-extract
      dockerfile: Dockerfile
    container_name: documind-pdf-extract
    hostname: pdf-extract
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PDF_MIN_USEFUL_CHARS: ${PDF_MIN_USEFUL_CHARS:-40}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-200}
      PDF_OCR_MAX_PAGES: ${PDF_OCR_MAX_PAGES:-30}
      PDF_MAX_CHARS: ${PDF_MAX_CHARS:-500000}
      PDF_OCR_LANG: ${PDF_OCR_LANG:-eng}
      PDF_TESSERACT_TIMEOUT: ${PDF_TESSERACT_TIMEOUT:-180}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Ingest worker (claim Redis/Postgres jobs → extract → embed → Qdrant)
  # Uses Docker-internal hostnames; host Next.js still uses localhost ports in .env
  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: documind-ingest-worker
    hostname: ingest-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-oriented .env values for in-network access
      DATABASE_URL: postgresql://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-documind}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://rustfs:9000
      QDRANT_URL: http://qdrant:6333
      PDF_EXTRACT_URL: http://pdf-extract:8090
      PDF_OCR_MODE: ${PDF_OCR_MODE:-auto}
      PDF_EXTRACT_TIMEOUT_MS: ${PDF_EXTRACT_TIMEOUT_MS:-300000}
      INGEST_WORKER_ID: ${INGEST_WORKER_ID:-docker-worker-1}
      INGEST_POLL_MS: ${INGEST_POLL_MS:-1500}
      # GEMINI_API_KEY, QDRANT_COLLECTION, S3_* keys come from env_file
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      qdrant:
        condition: service_started
      pdf-extract:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  qdrant_storage:
  rustfs_data:
